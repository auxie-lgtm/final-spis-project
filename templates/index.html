<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="web_deco.css">
        <title class="center">Karaoke Feedback</title>
    </head>

    
    <body>
        <h2 class="center">Karaoke Evaluation</h2>
        <div class="white-square"></div>

        <form id="evaluation-form" method="POST" action="/run-code">
            <div class="center">
                <label for="description">Describe your performance:</label><br>
                <input type="text" id="description" name="description" placeholder="Describe your performance..." required>
            </div>
            <div class="center">
                <label for="audio_directory">Audio path:</label><br>
                <input type="text" id="audio_directory" name="audio_directory" placeholder="Type audio directory..." required>
            </div>
            <button type="submit" class="center">Evaluate</button>
        </form>

        <div id="resultDisplay" style="margin-top: 20px;"></div>

        

        <script>
            document.getElementById('evaluation-form').addEventListener('submit', function(event) {
                event.preventDefault();

                const formData = new FormData(this);

                fetch('/run-code', {
                    method: 'POST',
                    body: formData
                })
                .then(async response => {
                    const data = await response.json();
                    if (!response.ok) {
                        throw new Error(data.error || 'Request failed');
                    }
                    document.getElementById('resultDisplay').innerText = data.output;
                })
                .catch(error => {
                    document.getElementById('resultDisplay').innerText = 'Error: ' + error.message;
                    console.error('Error:', error);

                });
            });
            
            
            
        </script>
    </body>
</html>
