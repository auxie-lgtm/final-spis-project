<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rank Reveal</title>
<style>
  :root{
    --bg-deep:#05010f;
    --bg-mid:#150634;
    --neon-pink:#ff2fb0;
    --neon-cyan:#2fe8ff;
    --neon-gold:#ffd23f;
    --neon-red:#ff3b3b;
    --neon-green:#39ff8a;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    height:100%;
    background:
      radial-gradient(ellipse at 50% 20%, var(--bg-mid) 0%, var(--bg-deep) 70%);
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    overflow:hidden;
  }

  .stage{
    position:relative;
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    isolation:isolate;
  }

  /* scanlines for arcade-CRT feel */
  .scanlines{
    position:absolute;
    inset:0;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.035) 0px,
      rgba(255,255,255,0.035) 1px,
      transparent 2px,
      transparent 4px
    );
    pointer-events:none;
    z-index:5;
    mix-blend-mode:overlay;
  }

  .vignette{
    position:absolute;
    inset:0;
    background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.75) 100%);
    pointer-events:none;
    z-index:4;
  }

  .label{
    letter-spacing:.6em;
    font-size:clamp(14px,2.2vw,20px);
    color:#8b7cff;
    text-shadow:0 0 10px rgba(139,124,255,.8);
    margin-bottom:14px;
    opacity:0;
    animation:fadeIn .5s ease-out .15s forwards;
  }

  .rank-wrap{
    position:relative;
    width:clamp(220px,42vw,360px);
    height:clamp(220px,42vw,360px);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .ring{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:3px solid rgba(139,124,255,.35);
    box-shadow:0 0 40px rgba(139,124,255,.25) inset;
    animation:spinRing 10s linear infinite;
  }
  .ring.inner{
    inset:18px;
    border-color:rgba(255,47,176,.25);
    animation-duration:7s;
    animation-direction:reverse;
  }

  #rankLetter{
    position:relative;
    z-index:2;
    font-size:clamp(140px,26vw,260px);
    font-weight:900;
    line-height:1;
    color:#fff;
    -webkit-text-stroke:2px rgba(255,255,255,.15);
    filter:drop-shadow(0 0 6px rgba(255,255,255,.4));
    transform-origin:center;
  }

  /* per-rank colors */
  #rankLetter.rank-S{ color:var(--neon-gold); -webkit-text-stroke-color:rgba(255,210,63,.4);
    filter:drop-shadow(0 0 18px var(--neon-gold)) drop-shadow(0 0 46px var(--neon-gold)); }
  #rankLetter.rank-A{ color:var(--neon-cyan); -webkit-text-stroke-color:rgba(47,232,255,.4);
    filter:drop-shadow(0 0 14px var(--neon-cyan)) drop-shadow(0 0 34px var(--neon-cyan)); }
  #rankLetter.rank-B{ color:var(--neon-green); -webkit-text-stroke-color:rgba(57,255,138,.4);
    filter:drop-shadow(0 0 12px var(--neon-green)) drop-shadow(0 0 28px var(--neon-green)); }
  #rankLetter.rank-C{ color:#c9b8ff; -webkit-text-stroke-color:rgba(201,184,255,.4);
    filter:drop-shadow(0 0 10px #c9b8ff) drop-shadow(0 0 22px #c9b8ff); }
  #rankLetter.rank-D{ color:#ff9f4f; -webkit-text-stroke-color:rgba(255,159,79,.4);
    filter:drop-shadow(0 0 10px #ff9f4f) drop-shadow(0 0 22px #ff9f4f); }
  #rankLetter.rank-E{ color:#ff6f4f; -webkit-text-stroke-color:rgba(255,111,79,.4);
    filter:drop-shadow(0 0 10px #ff6f4f) drop-shadow(0 0 22px #ff6f4f); }
  #rankLetter.rank-F{ color:var(--neon-red); -webkit-text-stroke-color:rgba(255,59,59,.5);
    filter:drop-shadow(0 0 16px var(--neon-red)) drop-shadow(0 0 40px var(--neon-red)); }

  .cycling{
    animation:flip .11s linear;
  }

  .landed{
    animation:land .6s cubic-bezier(.2,1.4,.4,1) forwards;
  }

  .landed.rank-F, .landed.rank-E, .landed.rank-D{
    animation:landHarsh .55s cubic-bezier(.36,.07,.19,.97) forwards;
  }

  .stage.shake{
    animation:shake .5s cubic-bezier(.36,.07,.19,.97);
  }

  .flash{
    position:absolute;
    inset:0;
    background:#fff;
    opacity:0;
    z-index:6;
    pointer-events:none;
  }
  .flash.go{
    animation:flashPop .35s ease-out forwards;
  }

  .caption{
    margin-top:22px;
    font-size:clamp(16px,2.6vw,26px);
    letter-spacing:.35em;
    color:#fff;
    text-transform:uppercase;
    opacity:0;
    text-shadow:0 0 12px rgba(255,255,255,.6);
  }
  .caption.show{
    animation:fadeIn .5s ease-out forwards;
  }

  .replay{
    margin-top:36px;
    padding:10px 28px;
    background:transparent;
    border:2px solid #8b7cff;
    color:#e6e1ff;
    letter-spacing:.25em;
    font-size:13px;
    border-radius:999px;
    cursor:pointer;
    opacity:0;
    transition:background .2s, color .2s, box-shadow .2s;
  }
  .replay.show{
    animation:fadeIn .5s ease-out forwards;
  }
  .replay:hover{
    background:#8b7cff;
    color:#0a0620;
    box-shadow:0 0 24px rgba(139,124,255,.7);
  }

  .particle{
    position:absolute;
    top:50%;
    left:50%;
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--neon-gold);
    pointer-events:none;
    z-index:3;
  }

  @keyframes flip{
    0%{ transform:rotateX(0deg) scale(1); opacity:1; }
    45%{ transform:rotateX(90deg) scale(.9); opacity:.3; }
    55%{ transform:rotateX(90deg) scale(.9); opacity:.3; }
    100%{ transform:rotateX(0deg) scale(1); opacity:1; }
  }

  @keyframes land{
    0%{ transform:scale(2.6); opacity:0; }
    55%{ transform:scale(.92); opacity:1; }
    75%{ transform:scale(1.08); }
    100%{ transform:scale(1); }
  }

  @keyframes landHarsh{
    0%{ transform:scale(2.6) rotate(-4deg); opacity:0; }
    50%{ transform:scale(.88) rotate(2deg); opacity:1; }
    70%{ transform:scale(1.1) rotate(-1deg); }
    100%{ transform:scale(1) rotate(0deg); }
  }

  @keyframes shake{
    0%,100%{ transform:translate(0,0); }
    15%{ transform:translate(-10px,4px); }
    30%{ transform:translate(9px,-5px); }
    45%{ transform:translate(-7px,-3px); }
    60%{ transform:translate(8px,4px); }
    75%{ transform:translate(-5px,2px); }
    90%{ transform:translate(4px,-2px); }
  }

  @keyframes spinRing{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
  }

  @keyframes flashPop{
    0%{ opacity:.85; }
    100%{ opacity:0; }
  }

  @keyframes fadeIn{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }

  @keyframes particleBurst{
    0%{ transform:translate(-50%,-50%) translate(0,0) scale(1); opacity:1; }
    100%{ transform:translate(-50%,-50%) translate(var(--px),var(--py)) scale(0); opacity:0; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="scanlines"></div>
  <div class="vignette"></div>
  <div class="flash" id="flash"></div>

  <div class="label">FINAL&nbsp;RESULT</div>

  <div class="rank-wrap">
    <div class="ring"></div>
    <div class="ring inner"></div>
    <div id="rankLetter">S</div>
  </div>

  <div class="caption" id="caption"></div>
  <button class="replay" id="replayBtn">REPLAY</button>
</div>

<script>
  const RANKS = ["S","A","B","C","D","E","F"];
  const CAPTIONS = {
    S:"MARVELOUS",
    A:"GREAT",
    B:"GOOD",
    C:"ALMOST",
    D:"POOR",
    E:"BAD",
    F:"FAILED"
  };

  const rankEl   = document.getElementById('rankLetter');
  const stageEl  = document.getElementById('stage');
  const flashEl  = document.getElementById('flash');
  const captionEl= document.getElementById('caption');
  const replayBtn= document.getElementById('replayBtn');

  function clearRankClasses(){
    RANKS.forEach(r => rankEl.classList.remove('rank-'+r));
    rankEl.classList.remove('cycling','landed');
  }

  function spawnParticles(color){
    for(let i=0;i<26;i++){
      const p = document.createElement('div');
      p.className = 'particle';
      const angle = Math.random()*Math.PI*2;
      const dist = 80 + Math.random()*160;
      p.style.setProperty('--px', Math.cos(angle)*dist+'px');
      p.style.setProperty('--py', Math.sin(angle)*dist+'px');
      p.style.background = color;
      p.style.animation = `particleBurst ${0.6+Math.random()*0.5}s ease-out forwards`;
      stageEl.appendChild(p);
      setTimeout(()=>p.remove(), 1200);
    }
  }

  function playSequence(finalRank){
    clearRankClasses();
    captionEl.classList.remove('show');
    captionEl.textContent = '';
    replayBtn.classList.remove('show');
    stageEl.classList.remove('shake');
    flashEl.classList.remove('go');

    const finalIndex = RANKS.indexOf(finalRank);
    // build a flip sequence: full loop(s) through S..F then settle on target
    const sequence = [...RANKS.slice(0, finalIndex+1)];
    // add a couple of extra full cycles for suspense
    const fullCycle = [...RANKS];
    const path = [...fullCycle, ...fullCycle, ...sequence];

    let i = 0;
    let delay = 70;

    function step(){
      if(i >= path.length){
        // land on final
        rankEl.textContent = finalRank;
        clearRankClasses();
        rankEl.classList.add('rank-'+finalRank, 'landed');

        stageEl.classList.add('shake');
        flashEl.classList.add('go');

        if(finalRank === 'S'){
          spawnParticles('#ffd23f');
        } else if(finalRank === 'A'){
          spawnParticles('#2fe8ff');
        }

        setTimeout(()=>{
          captionEl.textContent = CAPTIONS[finalRank];
          captionEl.classList.add('show');
          replayBtn.classList.add('show');
        }, 350);
        return;
      }

      rankEl.textContent = path[i];
      clearRankClasses();
      rankEl.classList.add('rank-'+path[i], 'cycling');

      i++;
      // ease the flip speed: fast at start, slows near the end
      const progress = i / path.length;
      delay = 55 + progress*progress*260;
      setTimeout(step, delay);
    }
    step();
  }

  replayBtn.addEventListener('click', () => playSequence(grade));

  // initial run on load — animates from S down to F
  window.addEventListener('load', () => setTimeout(()=>playSequence(grade), 300));
</script>

</body>
</html>
